version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: amrutam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amrutam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amrutam_secret_pw}
      POSTGRES_DB: ${POSTGRES_DB:-amrutam_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amrutam_user -d amrutam_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - amrutam_network

  redis:
    image: redis:7-alpine
    container_name: amrutam_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - amrutam_network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: amrutam_prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - amrutam_network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: amrutam_grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - amrutam_network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: amrutam_otel_collector
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - ./docker/otel-collector/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - amrutam_network

volumes:
  postgres_data:
    name: amrutam_postgres_data
  redis_data:
    name: amrutam_redis_data
  prometheus_data:
    name: amrutam_prometheus_data
  grafana_data:
    name: amrutam_grafana_data

networks:
  amrutam_network:
    name: amrutam_network
    driver: bridge

